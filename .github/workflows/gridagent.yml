name: gridagent

on:
  push:
    paths:
      - "gridagent/**"
      - ".github/workflows/gridagent.yml"
  pull_request:
    paths:
      - "gridagent/**"
      - ".github/workflows/gridagent.yml"

# Separate workflow from PowerSimData's Pytest job so the gridagent stack
# (Python 3.11, uv, pandapower, pydantic-ai) doesn't interfere with the
# legacy matrix that still targets Python 3.7/3.8.
jobs:
  smoke:
    if: "!contains(github.event.head_commit.message, 'skip_ci')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridagent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.17"

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Cache both venvs between runs — uv's cache does the heavy lifting,
      # but keeping the resolved venvs on disk avoids a second resolve pass.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            gridagent/gridagent-tools/.venv
            gridagent/gridagent-orchestrator/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('gridagent/**/pyproject.toml') }}

      - name: Install gridagent-tools (with pandapower extra)
        run: |
          uv venv --python 3.11 gridagent-tools/.venv
          uv pip install --python gridagent-tools/.venv/bin/python -e gridagent-tools --extra pandapower

      - name: Tools smoke test (list → query → create → N-1)
        run: gridagent-tools/.venv/bin/python _smoke_test.py

      - name: Install gridagent-orchestrator (with pydantic-ai)
        run: |
          uv venv --python 3.11 gridagent-orchestrator/.venv
          uv pip install --python gridagent-orchestrator/.venv/bin/python \
            -e gridagent-orchestrator \
            -e gridagent-tools \
            pandapower

      - name: Orchestrator smoke test (pydantic-ai FunctionModel)
        run: gridagent-orchestrator/.venv/bin/python _orchestrator_smoke.py

  lint:
    if: "!contains(github.event.head_commit.message, 'skip_ci')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridagent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.17"

      - name: Ruff check
        run: |
          uv tool install ruff
          uvx ruff check \
            gridagent-tools/src \
            gridagent-orchestrator/src \
            gridagent-data/src
